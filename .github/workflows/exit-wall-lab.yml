name: Exit Wall Lab (research)

# 出口の壁ラボ（exit_wall_lab.py）: 「壁が近ければ早めに利確・壁が無ければ伸ばす」は期待値を上げるか。
# 2026-09-26 オーナー指示「出口戦略をさらに強化する必要がある」。
# Claude のセッションからは Yahoo に届かないので、価格の取得と計算はここで行う（exit-lab.yml と同じ考え方）。
# ⚠️ 判定のしかた（事前登録）は exit_wall_lab.py の冒頭に固定してある。結果を見てから基準を動かさない。
# ⚠️ 研究用: 作業ブランチへの push でだけ動き、結果（exit-wall-lab.json / .md）はそのブランチにコミットする。
#    main の自動実行には入れない（週次で回すかはオーナー判断）。

on:
  push:
    branches: ['claude/youthful-knuth-2cy5sc']
    paths: ['exit_wall_lab.py', '.github/workflows/exit-wall-lab.yml']
  workflow_dispatch:

concurrency:
  group: exit-wall-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy certifi
      - name: Run exit wall lab (writes exit-wall-lab.json / exit-wall-lab.md)
        run: |
          python exit_wall_lab.py --live signals-log.json --json exit-wall-lab.json --md exit-wall-lab.md
          cat exit-wall-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exit-wall-lab.json exit-wall-lab.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: exit wall lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
