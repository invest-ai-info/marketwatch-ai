name: Hedge Short Lab (manual)

# J35 J31 の売り（目印 B・C・10億円以上・寄り成行→引け成行）を、同じ金額の 1321.T（日経225連動型上場投信）の買い
# （同じ寄りに買い同じ大引けに売る）で打ち消すと、成績・落ち込み・建玉の大きさはどう変わるか（2011年から）。
# 2026-10-08 登録・オーナー「両方登録して続けてください」。目隠しではない（同じ取引を J31〜J34 で数えた）。
# ⚠️ 決まりは PILLAR_PREREG.md「J35」（事前登録）と hedge_short_lab.py の冒頭に固定。1321.T は Yahoo の日足（yfinance）。
# ⚠️ 手動実行のみ。先に jp-bars-cache（日足＝取れる全期間版）を1回。check（行数・組ごとの件数・1321.T の日数だけ・損益は数えない）→ run は1回だけ。
# ⚠️ 出力（hedge-short-lab.json / .md）は集計だけ・銘柄名なし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝行数と組ごとの件数だけ（損益は数えない・何も書かない）／run＝1回だけ数える"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: hedge-short-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the shared price store (if any)
        uses: actions/cache/restore@v4
        with:
          path: jp-bars
          key: jp-bars-none
          restore-keys: jp-bars-
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Test with made-up prices
        run: python tests/test_hedge_short_lab.py
      - name: Data check only (no returns)
        if: ${{ inputs.mode == 'check' }}
        run: |
          python -u hedge_short_lab.py --check | tee check.json
          { echo '```json'; tail -n +1 check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python hedge_short_lab.py
          [ -f hedge-short-lab.md ] && cat hedge-short-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hedge-short-lab.json hedge-short-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: hedge short lab J35 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
