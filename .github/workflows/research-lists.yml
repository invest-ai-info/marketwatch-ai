name: Research Lists

# 検証済みリスト（verified-list.md）と昇格リスト（promotion-list.md）を、記録から組み立て直す（2026-09-30 オーナー
# 「成績の良いものは昇格リスト、悪いものは検証済みリスト…後に改善して再検証したい」）。
# 手元で数えた記録（*-screen.json＝総当たりのふるい分け・s4-level-fade.json）が mw sync で届いたときと、組み立てのコードが変わったときに動く。
# ⚠️ 決まりは PILLAR_PREREG.md「M6」。判定は screen_judge.py（手元の計算が import する）。ここでは数え直さない＝組み立てるだけ。
# ⚠️ 出力（verified-list.md / promotion-list.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  push:
    branches: [main]
    paths:
      - '*-screen.json'
      - 's4-level-fade.json'
      - 'auto-forward.json'
      - 'oikawa-lab.json'
      - 'tokyo-break-lab.json'
      - 'flow-lab.json'           # 🆕 2026-11-11 FL 大きな流れに乗る（手元で数えて送る）
      - 'flow-jpy-confirm.json'   # 🆕 2026-11-11 FLC 円の流れを昔の期間で確かめる（手元で数えて送る）
      - 'quiet-range-lab.json'    # 🆕 2026-11-14 RG 静かな時間帯のレンジの上下（手元で数えて送る）
      - 'chart-pattern-lab.json'  # 🆕 2026-11-15 CP 1時間足の三角持ち合いとフラッグ（手元で数えて送る）
      - 'mr-lab.json'
      - 'ms-lab.json'
      - 'kj-lab.json'          # 🆕 2026-10-20 KJ 九条式（手元で数えて送る）
      - 'kjg-lab.json'         # 🆕 2026-10-20 KJG 九条式を金で（手元で数えて送る）
      - 'as-lab.json'          # 🆕 2026-10-20 AS 浅見式（手元で数えて送る）
      - 'rh-lab.json'          # 🆕 2026-10-20 RH リオン式の高値付近からのショート（手元で数えて送る）
      - 'rv-lab.json'          # 🆕 2026-10-20 RV リオン式の残りの入り方9つ（手元で数えて送る）
      # 🆕 2026-11-25 オーナー「自動にする」＝手元で数えて mw sync で送るのに、ここに無かった10本（送ってもリストが作り直されなかった）
      - 'series-break-lab.json'  # SB シリーズの抜けにすぐ乗る
      - 'kata1-lab.json'       # KT1 オーナーの型1
      - 'kata2-lab.json'       # KT2 オーナーの型1（一気版）
      - 'oj-lab.json'          # OJ オーナーの押し目
      - 'oj2-lab.json'         # OJ2 オーナーの押し目（30pips 版）
      - 'oj3-lab.json'         # OJ3 ユーロポンド×ドル円の押し目
      - 'btg-lab.json'         # BT 4時間足BTG改
      - 'btg-judge.json'       # BTJ 4時間足BTG改に教材の判断を足したもの
      - 'r4-armb.json'         # R4 腕B 月末のロンドン 08:00→16:00
      - 'se-m5-lab.json'       # SE 損切りの線まで待って同じ向きに指値（5分足の腕）
      # 🔁 2026-11-20 J-Quants の数で数えた研究の記録（f1-early・f1g-forward・j9-yutai・highs-fund・highs-value・j52-timing）は送らない＝道を外した（相談メモ⑪ の C）
      - 'j10b-records.json'     # 🆕 2026-11-13 J10b・J46 の判定（朝の板の記録・クラウドのセッションが足す）を検証済みリストの「📏」の節へ
      - 'method-lab-registry.json'  # 🆕 2026-11-17 毎日の新しい方法（routine が毎朝1つ入れて1つ外す）＝外したものを検証済みリストへ
      - 'verified_list.py'
      - 'promotion_list.py'
      - 'screen_judge.py'
  workflow_dispatch:

concurrency:
  group: research-lists
  cancel-in-progress: false

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Test the judge and the lists
        run: python tests/test_screen_judge.py
      - name: Build the lists
        run: |
          python verified_list.py > /dev/null
          python promotion_list.py > /dev/null
          cat promotion-list.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add verified-list.md promotion-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: research lists $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            # 生成物なので、衝突したら今回生成した側を採る（yori-forward.yml と同じ考え方）
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
