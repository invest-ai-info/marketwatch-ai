name: Exit Indicator Lab E1 (manual)

# 出口の指標ラボ E1（損切り8×利確8×入口60・2026-09-30 オーナー指示）。
# ⚠️ 選び方・確かめ方・判定は PILLAR_PREREG.md「E1」（事前登録）と exit_ind_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ（定期実行を足すときはオーナーに確認）。
# ⚠️ 出力（exit-ind-lab.json / exit-ind-lab.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:

concurrency:
  group: exit-ind-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 動き出した時点の最新（先の実行の結果を消さないため）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Count with the pre-registered ruler
        run: |
          python exit_ind_lab.py
          [ -f exit-ind-lab.md ] && cat exit-ind-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exit-ind-lab.json exit-ind-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: exit ind lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
