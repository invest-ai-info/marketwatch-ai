name: Prevday Lab (manual)

# J16 前の日に大きく動いた株が今朝ふつうに寄ったとき、寄りのあとは続くか戻るか（昔の期間と最近の期間の両方で）。
# 2026-10-07 朝 登録・オーナー「続けてください」（研究の加速）。
# ⚠️ 決まりは PILLAR_PREREG.md「J16」（事前登録）と prevday_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ。先に jp-bars-cache を同じ日に1回。本番の前に diag を1回。本番は1回だけ。
# ⚠️ 出力（prevday-lab.json / .md）は集計だけ・銘柄名なし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      diag:
        description: 'データの形と件数だけを見る（値動きは出さない・コミットしない）'
        type: boolean
        default: true

concurrency:
  group: prevday-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the shared price store (if any)
        uses: actions/cache/restore@v4
        with:
          path: jp-bars
          key: jp-bars-none
          restore-keys: jp-bars-
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Diagnose data shape (no commit)
        if: ${{ inputs.diag }}
        run: |
          python prevday_lab.py --diag | tee diag.json
          { echo '```json'; tail -n +1 diag.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ !inputs.diag }}
        run: |
          python prevday_lab.py
          [ -f prevday-lab.md ] && cat prevday-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ !inputs.diag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prevday-lab.json prevday-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: prevday lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
