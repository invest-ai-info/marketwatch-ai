name: Weekly Levels

# 週次ゾーン分析の素材（テクニカル水準）を計算してコミットする。
# 読み手＝routine weekly-strategy-brief（日曜 18:30 JST・48時間以内の水準だけ使う）と
#         weekly-zone-plan（日曜 20:00 JST）。
# ※リモートCCRでは yfinance が 403 で使えないため、データ計算は確実な GitHub Actions 側で実施。
#
# 🔁 2026-10-04 改定（旧＝日曜 17:00/18:00 JST）: 8/30 以降、実際の実行が毎週 21:00〜23:35 JST に
#    ずれ込み（cron の遅れ・区切りの良い時刻ほど遅い）、2本の routine に間に合わなかった。
#    週次戦略は 9/6〜9/27 の4週連続で verified=false（記事に水準が載らない）、ゾーン計画は7日前の水準を使っていた。
#    → **土曜の朝**に前倒しする。水準は金曜の終値で決まり週末に変わらない（ビットコインだけ動く）ので、
#      土曜に計算しても内容は同じ。日曜の朝にもう1本（ビットコインの更新と保険）。
#      遅れが5〜7時間あっても日曜 18:30 より前に終わり、土曜の回でも日曜夕方の時点で約32時間＝48時間以内。

on:
  schedule:
    - cron: '17 1 * * 6'   # 土曜 10:17 JST 本命（半端な分のほうが cron の順番待ちが短い）
    - cron: '47 4 * * 6'   # 土曜 13:47 JST 保険
    - cron: '23 0 * * 0'   # 日曜 09:23 JST 保険（ビットコインの水準を新しくする）
  workflow_dispatch:        # 手動実行も可能

jobs:
  levels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy certifi

      - name: Compute technical levels (18 instruments)
        run: python compute_levels.py 1>/dev/null

      - name: Commit weekly-levels.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly-levels.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly levels $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            git pull --rebase origin main || true
            git push
          fi
