name: Monthly Calendar Reminder

# 目的:
# - 毎月 25 日朝に「来月の主要経済指標」を Gemini で取得 → メール送信
# - 同時に generate_market_holidays.py で 2026-2027 年の市場休場日を自動補充
# - sync_economic_events.py で経済指標を ECONOMIC_EVENTS_2026 から生成（手動転記の廃止）
# - economic-events.json に追加された休場日は git push

on:
  schedule:
    # 25 日 00:13 UTC = 25 日 09:13 JST (cron 混雑回避のため :00 を避ける)
    - cron: '13 0 25 * *'
  workflow_dispatch:

jobs:
  calendar-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER:           ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_RECIPIENT:      ${{ secrets.ALERT_RECIPIENT }}
      GITHUB_ACTIONS_RUN:   "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Auto-add market holidays (2026-2027)
        run: python generate_market_holidays.py

      # 🆕 2026-08-30 追加。economic-events.json の「経済指標」は
      # monthly_calendar_reminder.py がメールを送るだけで JSON には書かず、
      # 転記は人手だった（_update_policy「月初に当月分を手動更新」）。7月末で
      # 止まり、指標が2か月ゼロのまま誰も気づけなかった（メールを送れば
      # ワークフローは success なので automation-health からも見えない）。
      # サイトの calendar.html は別台帳 ECONOMIC_EVENTS_2026 で保守が続いていたので、
      # そちらから生成して台帳の二重管理をやめる＝手動転記の工程自体を無くす。
      - name: Sync economic indicators from ECONOMIC_EVENTS_2026
        run: python sync_economic_events.py --write

      # 🆕 2026-08-30。まずドライラン（--write なし）で yfinance の戻りをログで確認する。
      # ローカルPCは curl_cffi が CA証明書を見つけられず検証できないため、Actions で測る。
      - name: Probe earnings dates (dry-run)
        run: pip install yfinance >/dev/null && python sync_earnings_events.py
        continue-on-error: true

      - name: Send monthly calendar reminder email
        run: python monthly_calendar_reminder.py

      - name: Commit & push if economic-events.json updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add economic-events.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: market holidays auto-fill $(TZ=Asia/Tokyo date +'%Y-%m-%d JST')"
            git pull --rebase origin main || true
            git push
          fi
