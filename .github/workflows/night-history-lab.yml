name: Night History Lab (manual)

# R8 日経平均の夜の上げ（終値で買い次の取引日の始値で売る）は、R7 が使っていない昔の時代（1992〜2010年）でも出ていたか
# （^N225 の日足・使える年はデータの形だけで決める・配当落ちの夜を除く・指数の始値を R7 の期間の 1321.T と突き合わせる）。
# 2026-10-08 登録・オーナー「やり直さなくていいので続けてください」。
# ⚠️ 物差し・判定は PILLAR_PREREG.md「R8」（事前登録・計算より先にコミット済み）と night_history_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ（check＝点検だけを先に1回 → run＝1回だけ数える）。
# ⚠️ 出力（night-history-lab.json / .md）と verified-list.md は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝データの点検だけ（損益は数えない・何も書かない）／run＝1回だけ数える"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: night-history-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Test with made-up prices
        run: python tests/test_night_history_lab.py
      - name: Data check only (no counting)
        if: ${{ inputs.mode == 'check' }}
        shell: bash
        run: python -u night_history_lab.py --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python night_history_lab.py
          python verified_list.py > /dev/null
          [ -f night-history-lab.md ] && cat night-history-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add night-history-lab.json night-history-lab.md verified-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: night history lab R8 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
