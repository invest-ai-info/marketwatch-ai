name: Combo Lab (manual)

# 組み合わせの相性ラボ（トレンド×オシレーター×出口・2026-09-27 オーナー「どれが一番相性いいか調べて」）。
# ⚠️ 選び方・確かめ方・判定は PILLAR_PREREG.md「組み合わせの相性ラボ」（事前登録）と combo_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ（定期実行を足すときはオーナーに確認）。
# ⚠️ 出力（combo-lab.json / combo-lab.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:

concurrency:
  group: combo-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 動き出した時点の最新（先の実行の結果を消さないため）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Count with the pre-registered ruler
        run: |
          python combo_lab.py
          [ -f combo-lab.md ] && cat combo-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add combo-lab.json combo-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: combo lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
