name: TOM Basket Lab (manual)

# J41 日本の早い月末月初（R3 Q3 の窓）を、売買代金の大きい個別株の籠で、引け成行どうしで取る。
# 2026-10-08 登録・オーナー「両方登録して進めてください」。目隠しではない（指数の窓は R3 で数えた）。
# ⚠️ 決まりは PILLAR_PREREG.md「J41」（事前登録）と tom_basket_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ。先に jp-bars-cache（日足の全期間版）→ check（件数だけ・損益は数えない）→ run は1回だけ。
# ⚠️ 出力（tom-basket-lab.json / .md）は集計だけ・銘柄名なし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝件数だけ（損益は数えない・何も書かない）／run＝1回だけ数える"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: tom-basket-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the shared price store (if any)
        uses: actions/cache/restore@v4
        with:
          path: jp-bars
          key: jp-bars-none
          restore-keys: jp-bars-
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Test with made-up prices
        run: python tests/test_tom_basket_lab.py
      - name: Data check only (no returns)
        if: ${{ inputs.mode == 'check' }}
        run: |
          python -u tom_basket_lab.py --check | tee check.json
          { echo '```json'; tail -n +1 check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python tom_basket_lab.py
          python verified_list.py > /dev/null
          [ -f tom-basket-lab.md ] && cat tom-basket-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tom-basket-lab.json tom-basket-lab.md verified-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: tom basket lab J41 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
