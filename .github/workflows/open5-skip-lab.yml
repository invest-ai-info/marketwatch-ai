name: Open5 Skip Lab (manual)

# J27 最初の5分で大きく動いた株は、足を1本空けても 9:30 までに戻るか（J22 の W1・W2 が売り買いの差の見かけかを切り分ける）。
# 2026-10-07 夜 登録・オーナー「続けてください」。
# ⚠️ 決まりは PILLAR_PREREG.md「J27」（事前登録）と open5_skip_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ。先に jp-bars-cache を1回。check（朝の数と組ごとの件数だけ・損益は数えない）→ run は1回だけ。
# ⚠️ 出力（open5-skip-lab.json / .md）は集計だけ・銘柄名なし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝朝の数と組ごとの件数だけ（損益は数えない・何も書かない）／run＝1回だけ数える／relist＝数え直さずに検証済みリストの欄を足す"
        required: true
        default: check
        type: choice
        options: [check, run, relist]

concurrency:
  group: open5-skip-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the shared price store (if any)
        uses: actions/cache/restore@v4
        with:
          path: jp-bars
          key: jp-bars-none
          restore-keys: jp-bars-
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Test with made-up prices
        run: python tests/test_open5_skip_lab.py
      - name: Data check only (no returns)
        if: ${{ inputs.mode == 'check' }}
        run: |
          python -u open5_skip_lab.py --check | tee check.json
          { echo '```json'; tail -n +1 check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python open5_skip_lab.py
          python verified_list.py > /dev/null
          [ -f open5-skip-lab.md ] && cat open5-skip-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Add the verified-list fields without recounting
        if: ${{ inputs.mode == 'relist' }}
        run: |
          python open5_skip_lab.py --relist
          python verified_list.py > /dev/null
      - name: Commit results
        if: ${{ inputs.mode == 'run' || inputs.mode == 'relist' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add open5-skip-lab.json open5-skip-lab.md verified-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: open5 skip lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
