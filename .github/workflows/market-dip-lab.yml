name: Market Dip Lab (manual)

# J25 相場全体が安く寄った朝の深い下げは戻るか（まだ使っていない 2006〜2016年の日足で確かめる）。
# 2026-10-07 登録・オーナー「一二を登録して続けてください」。
# ⚠️ 決まりは PILLAR_PREREG.md「J25」（事前登録）と market_dip_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ。先に jp-bars-cache（日足＝取れる全期間版）を1回。check（損益は数えない）→ run は1回だけ。
# ⚠️ 出力（market-dip-lab.json / .md）は集計だけ・銘柄名なし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝行数と回数だけ（損益は数えない・何も書かない）／run＝1回だけ数える"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: market-dip-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the shared price store (if any)
        uses: actions/cache/restore@v4
        with:
          path: jp-bars
          key: jp-bars-none
          restore-keys: jp-bars-
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Test with made-up prices
        run: python tests/test_market_dip_lab.py
      - name: Data check only (no returns)
        if: ${{ inputs.mode == 'check' }}
        run: |
          python -u market_dip_lab.py --check | tee check.json
          { echo '```json'; tail -n +1 check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python market_dip_lab.py
          [ -f market-dip-lab.md ] && cat market-dip-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-dip-lab.json market-dip-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: market dip lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
