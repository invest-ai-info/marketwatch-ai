name: Calendar Lab (manual)

# R3 株価指数の時間の癖（MT4 で全自動にできる短期）＝月末月初（米国・日本・日本の早い窓）と日中のモメンタム（SPY）を、
# 論文が出たあとの期間だけ・MT4 の株価指数 CFD を想定した費用で数える。2026-10-05 登録・オーナー「研究のテーマは短期売買」。
# ⚠️ 物差し・判定は PILLAR_PREREG.md「R3 株価指数の時間の癖」（事前登録・計算より先にコミット済み）と calendar_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ（1回だけ数える。データの取得に失敗したら何も数えず失敗する＝直し方を登録してからやり直す）。
# ⚠️ 出力（calendar-lab.json / calendar-lab.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:

concurrency:
  group: calendar-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Test with made-up prices
        run: python tests/test_calendar_lab.py
      - name: Count with the pre-registered ruler
        run: |
          python calendar_lab.py
          [ -f calendar-lab.md ] && cat calendar-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar-lab.json calendar-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: calendar lab R3 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
