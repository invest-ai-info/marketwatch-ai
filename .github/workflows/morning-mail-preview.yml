name: Morning Mail Preview (manual)

# 朝の指標メール（indicator-digest.yml）の中身を、**送らずに**表示するだけ（2026-10-08 夜 新設）。
# 通貨の強弱（fx_strength.py）と中国・豪州の見出し（asia_news.py）は Actions からしか取れないので、メールの中身を変えたときの確認に使う。
# ⚠️ 何も送らない・何も書き換えない（一時ファイルはこの実行の中だけ）。表示は実行の Summary。

on:
  workflow_dispatch:
    inputs:
      when:
        description: "メールの日時（JST・例 2026-10-09T06:20）。空なら次の平日の 06:20（london は 14:00・ny は 19:30）"
        required: false
        default: ""
      kind:
        description: "morning＝朝の指標メール／london＝ロンドン前／ny＝NY前（2026-10-08 夜 追加）"
        required: false
        default: morning
        type: choice
        options: [morning, london, ny]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Currency strength
        continue-on-error: true
        env:
          KIND: ${{ inputs.kind }}
        run: |
          case "$KIND" in london) python fx_strength.py --since-jst 9 ;; ny) python fx_strength.py --since-jst 15 ;; *) python fx_strength.py ;; esac
      - name: Headlines
        continue-on-error: true
        env:
          KIND: ${{ inputs.kind }}
        run: |
          case "$KIND" in london) python asia_news.py --set europe ;; ny) python asia_news.py --set us ;; *) python asia_news.py ;; esac
      - name: Show the mail (not sent)
        env:
          WHEN: ${{ inputs.when }}
          KIND: ${{ inputs.kind }}
        run: |
          hm=06:20; [ "$KIND" = london ] && hm=14:00; [ "$KIND" = ny ] && hm=19:30
          if [ -z "$WHEN" ]; then
            d=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            [ "$KIND" = morning ] || [ -z "$KIND" ] && d=$(TZ=Asia/Tokyo date -d tomorrow +%Y-%m-%d)
            while [ "$(date -d "$d" +%u)" -gt 5 ]; do d=$(date -d "$d + 1 day" +%Y-%m-%d); done
            WHEN="${d}T${hm}"
          fi
          if [ "$KIND" = london ] || [ "$KIND" = ny ]; then
            python session_brief.py --session "$KIND" --dry-run --now "$WHEN" | tee mail.txt
          else
            python send_indicator_digest.py --dry-run --now "$WHEN" | tee mail.txt
          fi
          { echo '```'; cat mail.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
