# 一回限りの試走: exit_lab.py を本物の価格で1回まわして、結果をログと Summary に出す（リポジトリには書かない）。
# ⚠️ 作業ブランチ専用。確認が済んだら消す（定期実行は exit-lab.yml）。
name: Exit Lab Trial (one-off)

on:
  push:
    branches: [claude/great-planck-07jpht]
    paths:
      - .github/workflows/exit-lab-trial.yml

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy certifi
      - name: Run exit lab
        run: |
          python exit_lab.py --json exit-lab.json --md exit-lab.md
          ls -la exit-lab.json exit-lab.md
          cat exit-lab.md
          cat exit-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics (2nd trial)
        run: |
          python - <<'PY'
          import json
          d = json.load(open("exit-lab.json", encoding="utf-8"))
          cs = [c for c in d["cells"] if c["period"] == "is" and c.get("avg") is not None]
          print("== |平均R| が大きいマス（上位25）: 件数・1Rの大きさ(ATR)・勝率・下位5%・最悪 ==")
          for c in sorted(cs, key=lambda c: -abs(c["avg"]))[:25]:
              print(c["tf"], c["entry"], c["side"], c["sl"], c["tp"], "n=", c["n"], "/", c["n_entries"],
                    "avg=", c["avg"], "risk_atr=", c.get("risk_atr_median"), "win=", c.get("win"),
                    "p5=", c.get("p5"), "worst=", c.get("worst"))
          print("== 目立つマス: 差・前後半 ==")
          for c in cs:
              if c.get("flag"):
                  print(c["tf"], c["entry"], c["sl"], c["tp"], "vs=", c["vs_base"], "early=", c.get("vs_base_early"),
                        "late=", c.get("vs_base_late"), "p=", c.get("p"), "risk_atr=", c.get("risk_atr_median"))
          print("== いまの方式との差の分布（IS・比べられたマス） ==")
          vs = [c["vs_base"]["avg"] for c in cs if isinstance(c.get("vs_base"), dict) and c["vs_base"].get("avg") is not None]
          vs.sort()
          print("マス数", len(vs), "最小", vs[0], "中央", vs[len(vs)//2], "最大", vs[-1])
          print("ボンフェローニ通過", sum(1 for c in cs if c.get("bonf")), "目立つ", sum(1 for c in cs if c.get("flag")))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exit-lab
          path: |
            exit-lab.json
            exit-lab.md
