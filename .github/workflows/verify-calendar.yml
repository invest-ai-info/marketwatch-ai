name: Verify Economic Calendar

# 目的: 米・英・ユーロ圏の重要指標の発表日を **各国の公式スケジュールと機械で突き合わせる**。
#   米   = BLS（verify_economic_calendar.py）
#   英EU = 英中銀 MPC / ECB 理事会 / ONS の Next release（verify_uk_eu_calendar.py）
#
# 🚨 なぜ必要か（2026-09-11 事故）: 米CPI（8月分）を 9/10(木) と載せていたが公式は 9/11(金)。
#    原因は「CPI は火〜木」という曜日からの推測。10月分も 11/12 → 正 11/10 で誤っていた。
#    **2026-07-02 に続く2度目**で、そのとき作った check_economic_events() は曜日ヒューリスティクス
#    だったため拾えなかった。🔑 曜日ルールを足すと、正しい金曜を弾いて誤った木曜を通してしまう。
#    日付の正しさは推測では決まらない＝**一次情報との突合だけが本当の再発防止**。
#
# 🔑 ここで回す理由: Claude セッションのコンテナからは bls.gov が egress 遮断される（CONNECT 403）が、
#    **GitHub Actions のランナーからは届く**。検証できる場所でやる。
#
# 読み取り専用（HTML やデータを書き換えない）。食い違い or 解析不能なら Issue を立てる。
# ⚠️ 「検証できなかった」も失敗扱い＝黙って緑にしない（沈黙の失敗を作らない）。

on:
  schedule:
    - cron: '10 22 * * 0'   # 月曜 07:10 JST（週の頭・指標week入りの前に気づける）
    - cron: '10 22 24 * *'  # 毎月25日 07:10 JST（monthly-calendar-reminder が翌月分を足す直前）
  workflow_dispatch:
  # ⚠️ 一時トリガー（構造調査用）。調査が終わったら必ず消す。
  push:
    branches: [claude/issue-check-do2bbk]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify against official schedules (US / UK / EU)
        # ⚠️ tee を挟むと既定では tee の終了コードが採られ、検証の失敗が緑になってしまう。
        #    pipefail でパイプ内の失敗を拾う（沈黙の失敗を作らない）。
        # 🔑 2本を**1ステップで**回す。別ステップにすると1本目が落ちた時点で2本目が走らず、
        #    Issue に片方のレポートしか載らない（＝もう片方の異常が見えなくなる）。
        shell: bash
        run: |
          set +e
          set -o pipefail
          python verify_economic_calendar.py | tee calendar_verify_report.txt
          us=$?
          printf '\n%s\n' '================ 英・ユーロ圏 ================' >> calendar_verify_report.txt
          python verify_uk_eu_calendar.py | tee -a calendar_verify_report.txt
          ukeu=$?
          echo "終了コード: 米=$us 英EU=$ukeu"
          [ $us -eq 0 ] && [ $ukeu -eq 0 ]

      - name: Open or update issue on failure
        if: failure() && hashFiles('calendar_verify_report.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('calendar_verify_report.txt', 'utf8');
            const today = new Date().toLocaleDateString('ja-JP', {
              timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
            }).replace(/\//g, '-');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'calendar-verify',
              per_page: 1
            });

            const md = '## 経済カレンダー検証\n\n```\n' + body + '\n```\n';
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 経済カレンダーが公式スケジュールと食い違う: ${today}`,
                body: md,
                labels: ['bug', 'calendar-verify']
              });
              core.info('新規 issue を作成しました');
            } else {
              const issueNumber = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## 🔁 ${today} 再検知\n\n${md}`
              });
              core.info(`既存 issue #${issueNumber} にコメント追加しました`);
            }
