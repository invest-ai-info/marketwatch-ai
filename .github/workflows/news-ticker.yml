name: News Ticker

# ⚡最新ニュース・ライブフィード（AI不使用・毎時）。news-ticker.json だけを commit する軽量レーン。
# index.html は JS が閲覧時に JSON を fetch するため、このワークフローで HTML 再生成は不要。
# ※update-market-news.yml の on:push paths に news-ticker.json は含まれない＝連鎖起動しない設計。

on:
  schedule:
    # 🆕 2026-08-28: 「1行に分を並記して増発」は効かないと実測で判明したため、
    #   1行→12行（2時間おき）に分割する。22.4h の実測:
    #     news-ticker    '7,27,47 * * * *'    1行 → 期待67回 / 実際 2回 (3.0%)
    #     political-alerts '13,28,43,58 …'    1行 → 期待89回 / 実際 2回 (2.2%)
    #     update-market-news                 10行 → 10回（全部届く）
    #     technical-alerts                    3行 →  3回（全部届く）
    #   届いた数は「- cron: の行数」と一致し、「1行内の発火時刻の数」とは一致しない。
    #   機序は未確定（エントリ単位で配信 / 1エントリの高頻度が間引かれる の区別がつかない）が、
    #   どちらでも対策は同じ＝低頻度エントリへの分割。
    #   ⚠️ 検証中: political-alerts.yml は 1行のまま据え置き＝対照群。
    #      到達率が上がったら毎時（24行）へ、変わらなければ外部スケジューラ+workflow_dispatch へ。
    - cron: '13 0 * * *'    # 09:13 JST
    - cron: '13 2 * * *'    # 11:13 JST
    - cron: '13 4 * * *'    # 13:13 JST
    - cron: '13 6 * * *'    # 15:13 JST
    - cron: '13 8 * * *'    # 17:13 JST
    - cron: '13 10 * * *'   # 19:13 JST
    - cron: '13 12 * * *'   # 21:13 JST
    - cron: '13 14 * * *'   # 23:13 JST
    - cron: '13 16 * * *'   # 01:13 JST
    - cron: '13 18 * * *'   # 03:13 JST
    - cron: '13 20 * * *'   # 05:13 JST
    - cron: '13 22 * * *'   # 07:13 JST
  workflow_dispatch:

concurrency:
  group: news-ticker
  cancel-in-progress: true

jobs:
  ticker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Build news ticker JSON
        run: python build_news_ticker.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-ticker.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: news ticker $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            # 🆕 2026-08-25 push リトライ（最大3回）。technical-alerts-*.yml と同じ型。
            # 動機: 8/25 15:00 JST の run が `cannot lock ref 'refs/heads/main'` で失敗した
            #       ＝fetch と push の間に別ワークフローが main を進めた競合。毎時レーンなので
            #       次の時間帯で追いつくが、失敗通知が鳴るぶん本物の異常が埋もれる。
            # news-ticker.json はこのワークフローだけが書く（SYNC禁忌）ので -X theirs＝
            # 再生成した側を採用してよい。
            # ⚠️ 3回とも失敗したら **明示的に落とす**（黙って緑にしない＝沈黙の失敗を作らない）。
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                echo "✅ Push success on attempt $i"
                pushed=1
                break
              fi
              echo "⚠️ Push failed (attempt $i), retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::3回試しても push できなかった（main の競合が継続している可能性）"
              exit 1
            fi
          fi
