name: Highs Entry Lab (manual)

# J49 上場来高値の「罠の見分け」「押し目の深さ」「手じまい」（12の問い）。J48 と同じケース・3つの時代・全体比（等しい重みの指数）。
# 2026-10-28 登録・オーナー「罠や騙しを高い確率で見つけてください。…どこまで押したときに買った方が勝率が高くなるのか、期待値が高くなるのか」
#     （テクニカルの区切りの例外・業績と割安さは J50＝手元）。
# ⚠️ 決まりは PILLAR_PREREG.md「J49」（事前登録）と highs_entry_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ。値段の置き場は一番新しいもの（日足の全期間版）→ check（件数・目印・約定の数だけ・損益は数えない）→ run は1回だけ。
# ⚠️ 出力（highs-entry-lab.json / .md）は集計だけ・銘柄名なし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝件数だけ（損益は数えない・何も書かない）／run＝1回だけ数える"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: highs-entry-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the shared price store (if any)
        uses: actions/cache/restore@v4
        with:
          path: jp-bars
          key: jp-bars-none
          restore-keys: jp-bars-
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Test with made-up prices
        run: python tests/test_highs_entry_lab.py
      - name: Data check only (no returns)
        if: ${{ inputs.mode == 'check' }}
        run: |
          python -u highs_entry_lab.py --check | tee check.json
          { echo '```json'; tail -n +1 check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python highs_entry_lab.py
          python verified_list.py > /dev/null
          [ -f highs-entry-lab.md ] && cat highs-entry-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highs-entry-lab.json highs-entry-lab.md verified-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: highs entry lab J49 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
