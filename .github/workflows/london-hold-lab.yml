name: London Hold Lab (manual)

# L4 ロンドン時間に入って、長めに持つ（サイトの通貨の強弱で強い通貨を買い弱い通貨を売る）。2026-09-30 夕登録・オーナー「そしたらテストをしてください」。
# ⚠️ 物差し・判定は PILLAR_PREREG.md「L4 ロンドン時間に入って、長めに持つ」（事前登録・計算より先にコミット済み）と london_hold_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ（1回だけ数える。データの取得に失敗したときだけやり直す＝取れないペアがあれば何もコミットしない）。
# ⚠️ 出力（london-hold-lab.json / london-hold-lab.md）と検証済みリスト（verified-list.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:

concurrency:
  group: london-hold-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 動き出した時点の最新（先の実行の結果を消さないため）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Test with made-up prices
        run: python tests/test_london_hold_lab.py
      - name: Count with the pre-registered ruler
        run: |
          python london_hold_lab.py
          python verified_list.py > /dev/null
          [ -f london-hold-lab.md ] && cat london-hold-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add london-hold-lab.json london-hold-lab.md verified-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: london hold lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
