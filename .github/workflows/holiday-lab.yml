name: Holiday Lab (manual)

# R5 日本の祝日の前の日（日経平均・論文のあとの 1992〜2026-09・MT4 の株価指数 CFD の費用）。2026-10-05 登録・オーナー「続けてください」。
# ⚠️ 物差し・判定は PILLAR_PREREG.md「R5」（事前登録・計算より先にコミット済み）と holiday_lab.py の冒頭に固定。
# ⚠️ 休場日は pandas_market_calendars の東証（XTKS）・NYSE。手動実行のみ（1回だけ数える）。
# ⚠️ 出力（holiday-lab.json / holiday-lab.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:

concurrency:
  group: holiday-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance pandas_market_calendars
      - name: Test with made-up prices
        run: python tests/test_holiday_lab.py
      - name: Count with the pre-registered ruler
        run: |
          python holiday_lab.py
          [ -f holiday-lab.md ] && cat holiday-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holiday-lab.json holiday-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: holiday lab R5 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
