name: Regime Lab (research)

# 環境の相性ラボ（regime_lab.py）: テクニカル指標が「効く環境・効かない環境」の検証。
# 2026-09-25 オーナー指示「どういう時に効くのか・効かないのかを徹底的にリサーチして検証して」。
# Claude のセッションからは Yahoo に届かないので、価格の取得と計算はここで行う（exit-lab.yml と同じ考え方）。
# ⚠️ 判定のしかた（事前登録）は regime_lab.py の冒頭に固定してある。結果を見てから基準を動かさない。
# ⚠️ 研究用: 作業ブランチへの push でだけ動き、結果（regime-lab.json / .md）はそのブランチにコミットする。
#    main の自動実行には入れない（週次で回すかはオーナー判断）。

on:
  push:
    branches: ['claude/youthful-knuth-2cy5sc']
    paths: ['regime_lab.py', '.github/workflows/regime-lab.yml']
  workflow_dispatch:

concurrency:
  group: regime-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy certifi
      - name: Run regime lab (writes regime-lab.json / regime-lab.md)
        run: |
          python regime_lab.py --live signals-log.json --json regime-lab.json --md regime-lab.md
          cat regime-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regime-lab.json regime-lab.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: regime lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
