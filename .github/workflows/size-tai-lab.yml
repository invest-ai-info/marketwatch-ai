name: Size Taishaku Lab (manual)

# J37 貸借銘柄だけの目印B（10億円以上・寄り成行→引け成行）で、建玉の大きさと落ち込みを数え直す（J33 の現実版）。
# 2026-10-08 登録・オーナー「両方登録して進めてください」。目隠しではない（同じ取引を J31〜J36 で数えた）。決まりにはしない。
# ⚠️ 決まりは PILLAR_PREREG.md「J37」（事前登録）と size_tai_lab.py の冒頭に固定。貸借銘柄の一覧は日本取引所グループの公表資料（いまの一覧・J36 と同じ読み方）。
# ⚠️ 手動実行のみ。先に jp-bars-cache（日足の全期間版）→ check（件数だけ・損益は数えない）→ run は1回だけ。
# ⚠️ 出力（size-tai-lab.json / .md）は集計だけ・銘柄名なし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝件数だけ（損益は数えない・何も書かない）／run＝1回だけ数える"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: size-tai-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the shared price store (if any)
        uses: actions/cache/restore@v4
        with:
          path: jp-bars
          key: jp-bars-none
          restore-keys: jp-bars-
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Test with made-up prices
        run: python tests/test_size_tai_lab.py
      - name: Data check only (no returns)
        if: ${{ inputs.mode == 'check' }}
        run: |
          python -u size_tai_lab.py --check | tee check.json
          { echo '```json'; tail -n +1 check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python size_tai_lab.py
          [ -f size-tai-lab.md ] && cat size-tai-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add size-tai-lab.json size-tai-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: size tai lab J37 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
