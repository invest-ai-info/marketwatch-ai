name: JP Stock Rankings

# 日本株 値上がり率/値下がり率 トップ20 を「当日の東京クローズ後」に計算して jp-rankings.json を更新。
# Yahoo の価格のみ使用（APIキー不要）。赤字/黒字・銘柄名・業種は静的 jp-stock-info.json から join。
# 更新で jp-rankings.json が commit されると update-market-news の on:push が hot-assets を即再描画。
# ⚠️ 朝(06-07時)実行はcron遅延で10時頃＝場中(東京9:00開場)に更新されうるので不可。
#    クローズ(15:00)後の16:40/17:10に実行＝遅延しても翌オープン(9:00)前に収まり「当日の確定ランキング」を保てる。
#
# 🚨 2026-09-01 実測: このワークフローはむしろ「遅すぎると古いデータになる」。過去14回の実行ログを全部読んだ結果:
#      定刻帯(16-17時 JST)に走った回 = 必ず当日の asof を取得（ 8/25 17:53→8/25 ・ 8/26 17:21→8/26 ・ 8/29 16:23→8/28 ）
#      深夜(00-05時 JST)に流れた回 = 必ず1営業日古い（ 8/28 03:24→8/26 ・ 8/29 04:34→8/27 ・ 9/1 00:24→8/28 ）
#    古いデータは前回と同じ内容になるので差分が出ず、「No changes.」で静かに終わる＝成功として記録される。
#    実際 2026-08-29〜09-01 の4日間、jp-rankings.json は静かに止まっていた（ジョブは毎回 success）。
#    対策＝cron を夕方帯に4本並べて「深夜に落ちきる前に1本当たる」確率を上げる。
#    ⚠️ これは確率を上げるだけで保証ではない。確実性が要るなら外部スケジューラから workflow_dispatch を叩く構成へ。
#
# 🚨 2026-09-25 実測（オーナー報告「日本株ランキングが更新されない」）: 4本の cron が**そろって約5時間遅れ**、
#    9/8〜9/25 の営業日はすべて 21:21〜23:25 JST にしか更新されていなかった（16:40 の回の実測 +4h22m〜+6h51m）。
#    大引け(15:30)から約6時間、トップと hot-assets は前の営業日の順位のまま。4本を並べても4本とも同じだけ遅れるので効かない。
#    → CLAUDE.md「cron は当てにならない」の手①＝**定刻に近い routine の push に相乗り**する（下の push:）。
#      ・news-daily-auto（17:40 JST）が毎日 drafts/news/NEWS_LEDGER.md を push＝実測 17:48〜17:57 JST（見送りの日も台帳は書く）
#      ・sns-post-daily（07:00/19:00 JST）が毎回 drafts/sns/ を push＝実測 07:09〜07:14 / 19:09〜19:13 JST
#      Yahoo が当日の日足を返すのは 17〜18時台には実績あり（8/25 17:53・8/26 17:21・9/24 18:19 はいずれも当日）。
#      17時台で間に合わなければ 19時台の回、それも駄目なら下の cron（約22時）が拾う。朝 07時台の回は前営業日のまま＝差分なしで終わる。
#    ⚠️ GITHUB_TOKEN で押したコミット（Actions 自身の push）はワークフローを起動しない＝相乗りできるのは routine の push だけ。
#    ⚠️ 場中の値を「終値」として書かないガードは build_jp_rankings.py 側（is_unsettled＝16:00 JST 前の当日バーは書かない）。
#    ⚠️ この繋ぎが黙って死んでいないかは check_automation_health.py §⑭（push 起動が直近3日にあるか）が見張る。

on:
  push:
    branches: [main]
    paths:
      - 'drafts/news/NEWS_LEDGER.md'   # news-daily-auto（17:48〜17:57 JST）
      - 'drafts/sns/**'                # sns-post-daily（19:09〜19:13 JST／朝の回は差分なしで終わる）
  schedule:
    - cron: '40 7 * * *'    # 16:40 JST（東証の大引け15:30の後・出来高ほぼ確定）※実際は約5時間遅れて21〜22時台に走る
    - cron: '10 8 * * *'    # 17:10 JST バックアップ（cron遅延/スキップ対策・翌オープン前に収まる）
    - cron: '10 9 * * *'    # 18:10 JST （🆕 2026-09-01）遅延しても夕方帯に残るための上乗せ
    - cron: '10 10 * * *'   # 19:10 JST （🆕 2026-09-01）同上。深夜に落ちた回は1営業日古いデータしか取れない
  workflow_dispatch:

# 自分自身の二重起動だけ直列化（jp-rankings.json のみ触る＝他workflowとはファイルが別）
concurrency:
  group: jp-rankings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (pandas/xlrd for JPX Excel)
        run: pip install pandas xlrd
      - name: Build JP rankings (Yahoo prices only, no key)
        run: python build_jp_rankings.py
      - name: Build JP margin balance (JPX official daily Excel, no key)
        run: python build_jp_margin.py || echo "margin build failed (non-fatal)"
      - name: Commit jp-rankings.json / jp-margin.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jp-rankings.json jp-margin.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: jp rankings $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            git pull --rebase -X ours origin main || true
            git push
          fi
