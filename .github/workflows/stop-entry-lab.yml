name: Stop Entry Lab SE (manual)

# SE 損切りの線まで待って、同じ向きに指値で入る（日足・4時間足・監視18銘柄・入口60）。
# 2026-10-24 登録・テクニカルの区切りの例外・オーナー「今までのテクニカルの検証を、まず損切りラインを確認して、そのラインに到達したときにエントリーする形にしたらどうなるか」。
# ⚠️ 決まりは PILLAR_PREREG.md「SE」（事前登録）と stop_entry_lab.py の冒頭に固定。5分足（入口32）は手元の MT5（research/loop/se_lab.py）。
# ⚠️ 手動実行のみ。check＝合図と約定の数だけ（損益は数えない・何も書かない）／run は1回だけ。
# ⚠️ 出力（stop-entry-lab.json / .md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝合図と約定の数だけ（損益は数えない・何も書かない）／run＝1回だけ数える"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: stop-entry-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 動き出した時点の最新（先の実行の結果を消さないため）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Tests
        run: python tests/test_stop_entry_lab.py
      - name: Data check only (no returns)
        if: ${{ inputs.mode == 'check' }}
        run: |
          python -u stop_entry_lab.py --check | tee check.json
          { echo '```json'; cat check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Count once with the pre-registered ruler
        if: ${{ inputs.mode == 'run' }}
        run: |
          python -u stop_entry_lab.py
          [ -f stop-entry-lab.md ] && cat stop-entry-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stop-entry-lab.json stop-entry-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: stop entry lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
