name: Political Alerts (Live Feed)

# 目的: トランプ Truth Social・WhiteHouse 公式声明・主要中銀発言を 30 分ごとに収集し、
#       political-feed.json / political-feed.html を更新、
#       新規 HIGH 発言があればメール通知を送る。

on:
  schedule:
    # 🆕 2026-08-29: 8/27 の '13,28,43,58 * * * *'（＝1日96回の要求）は逆効果だった。実測:
    #   - このレーン: 8/19〜8/25 は 31〜41回/日 → 8/27・8/28 は **2回/日**
    #   - **1行も変えていない** technical-alerts-1h（'5 * * * *'）も 21回/日 → 2回/日
    #   - リポジトリ全体の schedule 発火も 83回/日（8/26）→ 37回/日（8/27・8/28）
    #   ＝ 要求回数を増やすと **リポジトリ単位で絞られ、無関係なレーンまで道連れになる**。
    #   一方、1行=1日1回の cron しか持たない workflow（Update Market News の10行など）は
    #   同じ期間も 100% 届いていた。つまり効くのは「行の書き方」ではなく **要求の総量**。
    #   よって 96回/日 → 24回/日 に落とす。分は :00 混雑を避けて :13 のまま。
    # GitHub Actions cron は best-effort（遅延 0-30 分あり）＝正確な時刻は期待しない設計のまま。
    - cron: '13 * * * *'
  workflow_dispatch:

jobs:
  political-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
      GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER:         ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_RECIPIENT:    ${{ secrets.ALERT_RECIPIENT }}
      GITHUB_ACTIONS_RUN: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai feedparser

      - name: Fetch political news
        run: python fetch_political_news.py

      - name: Build political-feed.html
        run: python build_political_feed_page.py

      - name: Commit & push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add political-feed.json political-feed.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new political news to commit."
          else
            git commit -m "auto: political feed update $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            git pull --rebase origin main || true
            git push
          fi
