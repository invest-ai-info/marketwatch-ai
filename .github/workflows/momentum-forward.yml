name: Momentum Forward (J42F monthly)

# J42F 「過去12か月で一番上げた10銘柄」は翌月弱いか・前向きの記録（決める月 2026-10〜2028-09 の24か月）。
# 2026-10-08 夜 登録・オーナー「2を登録して進めてください」。事前登録＝PILLAR_PREREG.md「J42F」。
# 毎月3日ごろ、Yahoo から東証の全上場の5年の日足を取り直し（約15〜20分）、売る日が過ぎた月を1回だけ記録する（一度記録した月は書き換えない）。
# 買う日が過ぎた月の上位10銘柄は符号（コードのハッシュ）だけ残し、上場廃止で消えた数を数える。
# ⚠️ 出力（momentum-forward.json / .md）は集計だけ・銘柄名とコードなし。GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。
# 🕐 cron は遅れる（CLAUDE.md）＝半端な分・3日／4日／6日の3本。何回走っても同じ月は1回しか記録しない。

on:
  schedule:
    - cron: '37 1 3 * *'    # 3日 10:37 JST
    - cron: '47 3 4 * *'    # 4日 12:47 JST（保険）
    - cron: '17 2 6 * *'    # 6日 11:17 JST（正月など3日が休みの月の保険）
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝件数だけ（損益は数えない・何も書かない）／run＝記録する"
        required: true
        default: check
        type: choice
        options: [check, run]

concurrency:
  group: momentum-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Test with made-up prices
        run: |
          python tests/test_momentum_lab.py
          python tests/test_momentum_forward.py
      - name: Data check only (no returns)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
        run: |
          python -u momentum_forward.py --check | tee check.json
          { echo '```json'; tail -n +1 check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record settled months
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'run' }}
        run: |
          python momentum_forward.py
          python verified_list.py > /dev/null
          [ -f momentum-forward.md ] && cat momentum-forward.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum-forward.json momentum-forward.md verified-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: momentum forward J42F $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
