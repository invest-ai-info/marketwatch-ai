name: Auction Forward (weekdays)

# J31F 空売りの前向き：目印 B・C（前の日の売買代金10億円以上）の付いた株を寄り成行で売り、引け成行で買い戻す（損切りなし／+10％）。
# 2026-10-08 登録・オーナー「1と2を登録して続けてください」。記録だけ＝取引に入れるかはオーナーが決める。
# ⚠️ 決まりは PILLAR_PREREG.md「J31F」（事前登録）と auction_forward.py の冒頭に固定。
# ⚠️ 東証の全上場（約3,700）の日足（3か月）だけを取り、2026-10-09 以降で「今日より前」の朝だけを数える＝大引けが決まった日だけ。
#    実行の時刻がずれても結果は同じ。一度数えた朝は数え直さない。値段を取れない銘柄が5％を超えた回は1日も数えない。1回10〜15分。
# ⚠️ 出力（auction-forward.json / .md・verified-list.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。
#    積み上げた合計と判定を持つ＝古い版で上書きすると消える。
# ⚠️ メール・エンジン・売買の決まりには触れない（読むための記録だけ）。

on:
  schedule:
    - cron: '41 23 * * 0-4'   # 月〜金 08:41 JST（前の営業日までを数える）
    - cron: '11 4 * * 1-5'    # 月〜金 13:11 JST 保険（数えた朝は数え直さない）
  workflow_dispatch:

concurrency:
  group: auction-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 記録の最新を読む
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance openpyxl xlrd
      - name: Count only the mornings after registration
        run: |
          python -u short_limits.py --record || echo "⚠️ J40 の記録ができなかった（J31F はそのまま数える）"
          python auction_forward.py
          python verified_list.py > /dev/null
          [ -f auction-forward.md ] && cat auction-forward.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auction-forward.json auction-forward.md short-limits.json short-limits.md verified-list.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auction forward $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
