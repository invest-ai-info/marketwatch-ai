name: Hold Lab (manual)

# R1 持ち方の研究：ビットコインと株価指数を「ただ持つ」のと「200日線で離れる」「値動きに合わせて量を変える」のでは、
# 費用と税を引いたあとどちらが良いか。2026-10-05 登録・オーナー「余剰資金で徹底的な研究を進めていきたい」。
# ⚠️ 物差し・判定は PILLAR_PREREG.md「R1 持ち方の研究」（事前登録・計算より先にコミット済み）と hold_lab.py の冒頭に固定。
# ⚠️ 手動実行のみ（1回だけ数える。データが取れない資産があれば何も数えず失敗する＝そのときだけやり直す）。
# ⚠️ 出力（hold-lab.json / hold-lab.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。研究資金の金額は書かない。

# 🆕 2026-10-05 追記：データの取得の失敗で数え直すときは only（資産）と until（1回目と同じ最後の日）を入れる。
#    ほかの資産は今の hold-lab.json の結果をそのまま使う（PILLAR_PREREG.md「R1」の追記）。

on:
  workflow_dispatch:
    inputs:
      only:
        description: '数え直す資産（カンマ区切り・空なら全部）例: SP500,TOPIX'
        required: false
        default: ''
      until:
        description: 'この日までのデータで数える（YYYY-MM-DD・空なら最後まで）'
        required: false
        default: ''

concurrency:
  group: hold-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 動き出した時点の最新（先の実行の結果を消さないため）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Test with made-up prices
        run: python tests/test_hold_lab.py
      - name: Count with the pre-registered ruler
        run: |
          python hold_lab.py --only "${{ inputs.only }}" --until "${{ inputs.until }}"
          [ -f hold-lab.md ] && cat hold-lab.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hold-lab.json hold-lab.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: hold lab R1 ${{ inputs.only }} $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
