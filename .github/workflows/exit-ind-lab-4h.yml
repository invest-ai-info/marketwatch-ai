name: Exit Indicator Lab 4H M7 (manual)

# M7 腕A：4時間足で E1 と同じ総当たり（損切り8×利確8×入口60・時間帯の縛りなし・2026-10-01 オーナー「同じ条件で4時間足と日足で」）。
# ⚠️ 選び方・確かめ方・判定は PILLAR_PREREG.md「M7」（事前登録）と exit_ind_lab_4h.py の冒頭に固定。日足は E1 で数え済み。
# ⚠️ 手動実行のみ（定期実行を足すときはオーナーに確認）。
# ⚠️ 出力（exit-ind-lab-4h.json / exit-ind-lab-4h.md）は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。

on:
  workflow_dispatch:

concurrency:
  group: exit-ind-lab-4h
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 動き出した時点の最新（先の実行の結果を消さないため）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Count with the pre-registered ruler
        run: |
          python tests/test_exit_ind_lab_4h.py
          python exit_ind_lab_4h.py
          [ -f exit-ind-lab-4h.md ] && cat exit-ind-lab-4h.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exit-ind-lab-4h.json exit-ind-lab-4h.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: exit ind lab 4h $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
