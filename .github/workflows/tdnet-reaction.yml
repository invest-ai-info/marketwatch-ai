name: TDnet Reaction Mail (weekdays, trial)

# TDnet の開示 → 次の丸1日の値動きを追う（読むだけ・試験・結果はメールだけ）。PILLAR_PREREG.md「J51」・tdnet_reaction.py。
# 2026-11-10 オーナー「すべてを読んで、その次の日にどんな動きをしたのか追う」→「一から…メディアの見出しはいりません。
# 結果はメールだけで、とりあえずは試験的に」。AI は使わない（表題の言葉で種類分け・数字はプログラム）＝トークンは使わない。
# ⚠️ 開示の日ごとに1通（反応の日の 16:30 JST より後）。送った日は tdnet-reaction-days.json に残す＝同じ日に2通送らない。
# ⚠️ 台帳に置くのはコード・種類・数字だけ（表題と会社名はメールにだけ）。出力は GitHub 側で生成＝ローカルから push しない（SYNC禁忌）。
# 🆕 2026-11-10 夜 毎回、引けが確定した 1週間（5日目）・1か月（20日目）を台帳に埋め、種類ごとの傾向を tdnet-reaction-trend.json に
#    まとめ直す（判定は升ごとに1回だけ・2027-02-15 以降＝PILLAR_PREREG.md「J51」の追記）。メールの最後に「これまでの傾向」。
# ⚠️ cron は遅れる（CLAUDE.md）＝3本置いて、最初に当たった回が送る。止めるときはこのファイルを消すか、schedule を外す。

on:
  # 🆕 2026-11-17 cron は実測で8〜9時間遅れ（17:07 の予定が翌1〜8時）＝夜中はいちばん新しい日の日足が空で返り、メールが1日ずつ遅れた。
  #    夕方（JST 17〜19時）にも動く「Update Market News」の完了に相乗りする（送る日が無ければ約20秒で終わる）。cron は保険に残す
  workflow_run:
    workflows: ["Update Market News"]   # ⚠️ update-market-news.yml の `name:` と一字一句合わせる
    types: [completed]
  schedule:
    - cron: '7 8 * * 1-5'     # 17:07 JST
    - cron: '43 10 * * 1-5'   # 19:43 JST
    - cron: '13 14 * * 1-5'   # 23:13 JST（保険）
  workflow_dispatch:

concurrency:
  group: tdnet-reaction
  cancel-in-progress: false

jobs:
  reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # ためた開示（tdnet-events.csv の向き）と、送った日の記録の最新を読む
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test with made-up data
        run: python tests/test_tdnet_reaction.py
      - name: Measure and mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python tdnet_reaction.py
      # 🆕 2026-11-17 J52F：業績予想の修正のあと、どのタイミングで入ると勝ちやすいか（前向き・PILLAR_PREREG.md「J52」）。
      #    J51 の台帳から上方修正・下方修正を拾い、R の寄り・10:00・後場寄り・R〜R+30 の引けを比で記録。失敗しても J51 は止めない
      - name: J52F entry-timing forward record
        run: python tests/test_disclosure_timing_forward.py && python disclosure_timing_forward.py || echo "J52F failed (non-fatal)"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tdnet-reaction.csv tdnet-reaction-days.json tdnet-reaction-trend.json disclosure-timing-forward.csv disclosure-timing-forward.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: tdnet reaction $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || exit 1
          fi
